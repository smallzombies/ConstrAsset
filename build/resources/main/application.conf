app {
  port = 8080
  port = ${?PORT}
  db {
    url = "jdbc:postgresql://localhost:5432/constr_asset"
    url = ${?DB_URL}
    user = "constr"
    user = ${?DB_USER}
    password = "constr"
    password = ${?DB_PASSWORD}
    debugSql = false
  }
  redis {
    host = "localhost"
    host = ${?REDIS_HOST}
    port = 6379
    port = ${?REDIS_PORT}
  }
  minio {
    endpoint = "http://localhost:9000"
    endpoint = ${?MINIO_ENDPOINT}
    accessKey = "minioadmin"
    accessKey = ${?MINIO_ACCESS_KEY}
    secretKey = "minioadmin"
    secretKey = ${?MINIO_SECRET_KEY}
    bucket = "media-assets"
    bucket = ${?MINIO_BUCKET}
  }
  jwt {
    secret = "CHANGE_ME_IN_PRODUCTION_dev_only_secret_key_0123456789"
    secret = ${?JWT_SECRET}
  }
}
